name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked dependencies (hash-verified)
        run: |
          python -m pip install --require-hashes -r requirements-build.lock
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps --no-build-isolation --editable .
      - name: Static lint (ruff) — blocking
        run: |
          python -m pip install "ruff==0.12.7"
          ruff check .
      - name: Type check (mypy strict) — blocking
        run: |
          python -m pip install "mypy==1.17.1"
          mypy datashell/
      - name: Security lint (bandit) — blocking, zero-findings policy
        run: |
          python -m pip install "bandit==1.9.4"
          # Every suppressed finding carries an inline reason for review; a new
          # unsuppressed finding (any severity) fails the build.
          bandit -r datashell -q
      - name: Dependency vulnerability audit (pip-audit) — blocking
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit -r requirements.lock --progress-spinner off
          pip-audit -r requirements-dev.lock --progress-spinner off
          pip-audit -r requirements-otel.lock --progress-spinner off
          pip-audit -r sdks/python-client/requirements.txt --progress-spinner off
      - name: Verify pre-commit configuration is parseable
        run: |
          python -m pip install "pre-commit==4.2.0"
          python - <<'PY'
          import yaml
          with open('.pre-commit-config.yaml', encoding='utf-8') as f:
              config = yaml.safe_load(f)
          repos = config['repos']
          # `name` is optional in the pre-commit schema (it falls back to the
          # hook id), so keep this check schema-accurate with a fallback.
          names = [h.get('name', h.get('id')) for r in repos for h in r['hooks']]
          print('pre-commit config valid:', len(repos), 'repos, hooks:', names)
          PY
      - name: Verify release metadata consistency
        run: python scripts/check_release_metadata.py
      - name: Verify the committed OpenAPI document is in sync (docs/openapi.yaml)
        run: |
          python scripts/export_openapi.py --out docs/openapi.yaml
          git diff --exit-code -- docs/openapi.yaml
      - name: Build wheel and sdist from the pinned build backend
        run: python -m build --no-isolation --outdir dist
      - name: Verify built distribution contents (wheel + sdist)
        run: python scripts/verify_distribution_contents.py --dist-dir dist
      - name: Generate CycloneDX software bill of materials from the locked release dependencies
        run: |
          python -m pip install "cyclonedx-bom==7.5.0"
          cyclonedx-py requirements requirements.lock --pyproject pyproject.toml \
            --mc-type application --output-reproducible \
            --output-file dist/sbom.cyclonedx.json --output-format JSON
      - name: Compile source and tests
        run: python -m compileall -q datashell tests benchmarks examples integrations
      - name: Validate deployment YAML
        run: |
          python - <<'PY'
          import yaml
          for path in ("docker-compose.yml", "k8s-deployment.yaml", "deploy/prometheus-alerts.yaml"):
              with open(path, encoding="utf-8") as stream:
                  list(yaml.safe_load_all(stream))
              print(f"validated {path}")
          PY
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Run tests
        env:
          ENVIRONMENT: test
        run: python -m pytest -q -ra --strict-config --strict-markers
      - name: Run Airflow provider tests
        env:
          ENVIRONMENT: test
        run: python -m pytest integrations/airflow/tests -q -ra
      - name: Exercise the quickstart demo end to end
        env:
          ENVIRONMENT: test
        run: |
          python -m pytest tests/test_cli_demo.py -q
          python -m datashell.cli.main verify --help >/dev/null
      - name: Audit the resolved dependency sets
        run: |
          python -m pip install "pip-audit==2.10.1"
          pip-audit -r requirements.lock -r requirements-dev.lock -r requirements-build.lock -r requirements-otel.lock
      - name: Static security scan (Bandit)
        run: |
          python -m pip install "bandit==1.9.4"
          bandit -q -r datashell web -c .bandit -ll
      - name: Archive release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.python-version }}-release-evidence
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.cyclonedx.json
          if-no-files-found: warn
          retention-days: 30

  otel-collector-e2e:
    name: OpenTelemetry collector (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.lock
            requirements-otel.lock
      - name: Install locked dependencies (hash-verified)
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          # The tracing SDK and the OTLP/gRPC exporter are an optional extra;
          # this job is the only place they are installed, and it installs the
          # exact hash-pinned set from the otel lockfile.
          python -m pip install --require-hashes -r requirements-otel.lock
          python -m pip install --no-deps --no-build-isolation --editable .
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Export gateway spans to a real collector and assert the capture
        env:
          OTEL_E2E_EVIDENCE_DIR: ${{ github.workspace }}/otel-e2e-evidence
        run: bash scripts/run_otel_collector_e2e.sh
      - name: Archive collector evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: otel-collector-e2e-evidence
          path: otel-e2e-evidence/
          if-no-files-found: warn
          retention-days: 30

  container-build:
    name: Build production container
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build container image
        shell: bash
        run: |
          set -euo pipefail
          # Diagnostics for runner-level failures (disk exhaustion, daemon
          # trouble) that otherwise only surface as an opaque exit code.
          docker version
          df -h /
          # Base-image pulls and Debian/PyPI mirrors occasionally fail on hosted
          # runners before the build starts. Retry the build so a transient
          # registry or network error does not fail the job; the first attempt
          # refreshes the base image, later attempts reuse it.
          for attempt in 1 2 3; do
            args=(--progress=plain --tag datashell:ci)
            if [ "$attempt" -eq 1 ]; then
              args+=(--pull)
            fi
            echo "::group::docker build (attempt ${attempt}/3)"
            if docker build "${args[@]}" .; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -eq 3 ]; then
              echo "docker build failed after 3 attempts" >&2
              docker system df || true
              df -h / || true
              exit 1
            fi
            sleep $((attempt * 10))
          done
      - name: Check image configuration
        run: |
          test "$(docker image inspect datashell:ci --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker image inspect datashell:ci --format '{{.Config.WorkingDir}}')" = "/app"
      - name: Exercise production container with read-only root filesystem
        shell: bash
        run: |
          set -euo pipefail
          MASTER_KEY="$(openssl rand -hex 32)"
          HMAC_KEY="$(openssl rand -hex 32)"
          docker volume create datashell-ci-storage >/dev/null
          docker run -d --rm --name datashell-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,nodev,size=1100m \
            --mount type=volume,src=datashell-ci-storage,dst=/app/storage \
            --cap-drop ALL --security-opt no-new-privileges:true \
            -p 127.0.0.1:18000:8000 \
            -e ENVIRONMENT=production \
            -e DATASHELL_API_KEY="$MASTER_KEY" \
            -e DATASHELL_HMAC_SECRET="$HMAC_KEY" \
            -e DATASHELL_KEY_ID=ci-signing-key \
            -e ALLOWED_ORIGINS=https://console.ci.example \
            -e FORWARDED_ALLOW_IPS=127.0.0.1 \
            -e MIN_FREE_DISK_BYTES=0 \
            datashell:ci
          cleanup() {
            docker logs datashell-ci || true
            docker stop datashell-ci >/dev/null 2>&1 || true
            docker volume rm datashell-ci-storage >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18000/ready >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "Container did not become ready" >&2
              exit 1
            fi
            sleep 2
          done
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18000/docs)" = "404"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18000/metrics)" = "401"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H "X-API-Key: $MASTER_KEY" http://127.0.0.1:18000/metrics)" = "200"
