name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned build tooling (hash-verified)
        run: python -m pip install --require-hashes -r requirements-build.lock

      - name: Verify tag, package version, changelog and lockfiles agree
        run: python scripts/check_release_metadata.py --tag "${GITHUB_REF_NAME}"

      - name: Build package from the pinned build backend
        run: python -m build --no-isolation

      - name: Verify built distribution contents (wheel + sdist)
        run: python scripts/verify_distribution_contents.py --dist-dir dist

      - name: Build the Airflow provider distribution
        working-directory: integrations/airflow
        run: python -m build --no-isolation --outdir dist

      - name: Verify built provider distribution contents (wheel + sdist)
        run: python scripts/verify_provider_distribution_contents.py --dist-dir integrations/airflow/dist

      - name: Generate SBOM from the locked release dependencies
        run: |
          python -m pip install "cyclonedx-bom==7.5.0"
          cyclonedx-py requirements requirements.lock --pyproject pyproject.toml \
            --mc-type application --output-reproducible \
            --output-file dist/sbom.cyclonedx.json --output-format JSON

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/sbom.cyclonedx.json
            integrations/airflow/dist/*.whl
            integrations/airflow/dist/*.tar.gz
            docs/demo.gif
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
